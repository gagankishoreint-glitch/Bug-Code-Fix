<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CoFix</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #ffffff;
      color: #111111;
    }

    /* Outer Wrapper */
    .app-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
    }

    /* Top Navigation Bar */
    header {
      height: 50px;
      padding: 0 1.5rem;
      border-bottom: 1px solid #e5e5e5;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #ffffff;
      flex-shrink: 0;
    }

    .brand {
      font-weight: 700;
      font-size: 1.05rem;
      letter-spacing: -0.02em;
    }

    .status {
      font-size: 0.85rem;
      color: #666666;
      font-weight: 500;
    }

    /* Main Split Workspace */
    main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      height: calc(100vh - 50px);
      width: 100%;
    }

    .panel {
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
    }

    .panel-left {
      border-right: 1px solid #e5e5e5;
    }

    .panel-header {
      height: 48px;
      padding: 0 1.25rem;
      border-bottom: 1px solid #e5e5e5;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #fafafa;
      flex-shrink: 0;
    }

    .panel-title {
      font-size: 0.75rem;
      font-weight: 600;
      color: #666666;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* Code Text Editors */
    textarea, .code-output {
      flex: 1;
      width: 100%;
      height: 100%;
      background: #ffffff;
      color: #111111;
      border: none;
      padding: 1.25rem;
      font-family: ui-monospace, SFMono-Regular, "SF Pro Text", Menlo, Monaco, Consolas, monospace;
      font-size: 0.875rem;
      line-height: 1.6;
      outline: none;
      resize: none;
      white-space: pre;
      overflow: auto;
      tab-size: 4;
    }

    .code-output {
      margin: 0;
    }

    /* Bottom Action Bar */
    .panel-footer {
      height: 56px;
      padding: 0 1.25rem;
      border-top: 1px solid #e5e5e5;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #ffffff;
      flex-shrink: 0;
    }

    /* Clean Flat Buttons */
    button {
      background: #000000;
      color: #ffffff;
      border: 1px solid #000000;
      padding: 8px 18px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      border-radius: 4px;
      transition: background 0.15s ease;
    }

    button:hover {
      background: #222222;
    }

    button:disabled {
      background: #cccccc;
      border-color: #cccccc;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: #ffffff;
      color: #111111;
      border: 1px solid #d1d1d1;
      padding: 5px 12px;
      font-size: 0.8rem;
    }

    .btn-secondary:hover {
      background: #f5f5f5;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <header>
      <div class="brand">CoFix</div>
      <div class="status" id="status-text">Ready</div>
    </header>

    <main>
      <!-- Left Panel: Original Input -->
      <div class="panel panel-left">
        <div class="panel-header">
          <span class="panel-title">Original Code</span>
        </div>
        <textarea id="input-code" spellcheck="false" placeholder="Paste your code here...">def calculate_average(numbers):
    total = 0
    for i in range(len(numbers) + 1):
        total += numbers[i]
    return total / len(numbers)

print(calculate_average([10, 20, 30]))</textarea>
        <div class="panel-footer">
          <span class="status" id="char-count"></span>
          <button id="fix-btn" onclick="fixCode()">Fix Bug</button>
        </div>
      </div>

      <!-- Right Panel: Corrected Output -->
      <div class="panel">
        <div class="panel-header">
          <span class="panel-title">Corrected Code</span>
          <button class="btn-secondary" onclick="copyCode()">Copy</button>
        </div>
        <div class="code-output" id="output-code">// Fixed code will appear here...</div>
        <div class="panel-footer">
          <span class="status" id="time-text">--</span>
        </div>
      </div>
    </main>
  </div>

  <script>
    async function fixCode() {
      const input = document.getElementById('input-code').value;
      const output = document.getElementById('output-code');
      const fixBtn = document.getElementById('fix-btn');
      const status = document.getElementById('status-text');
      const timeText = document.getElementById('time-text');

      if (!input.trim()) return;

      fixBtn.disabled = true;
      status.innerText = "Fixing...";
      output.innerText = "// Processing code...";

      const startTime = performance.now();

      try {
        const response = await fetch('/api/fix', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            file_path: 'target_buggy_code.py',
            code_content: input
          })
        });

        const data = await response.json();

        if (!response.ok) throw new Error(data.detail || "Error fixing code");

        output.innerText = data.fixed_code;
        status.innerText = "Complete";

        const endTime = performance.now();
        timeText.innerText = `Done in ${((endTime - startTime)/1000).toFixed(2)}s`;

      } catch (err) {
        output.innerText = "// Error: " + err.message;
        status.innerText = "Failed";
      } finally {
        fixBtn.disabled = false;
      }
    }

    function copyCode() {
      const code = document.getElementById('output-code').innerText;
      if (code && !code.startsWith('//')) {
        navigator.clipboard.writeText(code);
        alert('Copied to clipboard!');
      }
    }
  </script>
</body>
</html>
